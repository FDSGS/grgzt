name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ matrix.target }}
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false

  gitee-release:
    name: 同步安装包到码云 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Windows 和 macOS 安装包
        uses: actions/download-artifact@v4
        with:
          pattern: workbench-*
          path: release-assets
          merge-multiple: true

      - name: 创建码云 Release 并上传附件
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::请先在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置 GITEE_TOKEN"
            exit 1
          fi

          API="https://gitee.com/api/v5/repos/limingtiana/grgzt"
          STATUS=$(curl -sS -o gitee-release.json -w '%{http_code}' \
            "${API}/releases/tags/${TAG_NAME}?access_token=${GITEE_TOKEN}")

          RELEASE_ID=""
          if [ "$STATUS" = "200" ]; then
            RELEASE_ID=$(python3 -c 'import json; data=json.load(open("gitee-release.json")); print(data.get("id", "") if isinstance(data, dict) else "")')
          fi

          if [ -z "$RELEASE_ID" ]; then
            curl --fail --silent --show-error --request POST "${API}/releases" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "tag_name=${TAG_NAME}" \
              --data-urlencode "name=个人工作台 ${TAG_NAME}" \
              --data-urlencode "body=Windows 和 macOS 安装包，由 GitHub Actions 自动构建并同步。" \
              --data-urlencode "target_commitish=main" \
              --output gitee-release.json
            RELEASE_ID=$(python3 -c 'import json; print(json.load(open("gitee-release.json"))["id"])')
          fi
          PIDS=()
          while IFS= read -r -d '' FILE; do
            (
              echo "正在上传：$(basename "$FILE")"
              if curl --fail --silent --show-error --http1.1 \
                --connect-timeout 30 \
                --speed-limit 1024 \
                --speed-time 60 \
                --max-time 10800 \
                --request POST \
                "${API}/releases/${RELEASE_ID}/attach_files" \
                --form "access_token=${GITEE_TOKEN}" \
                --form "file=@${FILE}" \
                --output /dev/null; then
                echo "上传完成：$(basename "$FILE")"
              else
                echo "::error::上传失败：$(basename "$FILE")"
                exit 1
              fi
            ) &
            PIDS+=("$!")
          done < <(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print0)

          UPLOAD_STATUS=0
          for PID in "${PIDS[@]}"; do
            if ! wait "$PID"; then
              UPLOAD_STATUS=1
            fi
          done
          exit "$UPLOAD_STATUS"
