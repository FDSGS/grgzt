name: 重新打包 macOS x64 安装包

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要替换安装包的版本标签，例如 v1.1.3'
        required: true
        default: 'v1.1.3'
  push:
    tags:
      - 'macfix-v*'

permissions:
  contents: write

env:
  RAW_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  rebuild:
    name: 构建 macOS x64 并替换 Release 附件
    runs-on: macos-latest
    steps:
      - name: 解析版本标签
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME=$(printf '%s' "${RAW_TAG}" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
          if [ -z "$TAG_NAME" ]; then
            echo "::error::无法从 ${RAW_TAG} 解析版本标签"
            exit 1
          fi
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 构建 macOS x64
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 校验安装包大小
        shell: bash
        run: |
          set -euo pipefail
          LIMIT=104857600
          ls -l release/*.dmg
          for FILE in release/*.dmg; do
            NAME=$(basename "$FILE")
            SIZE=$(stat -f %z "$FILE")
            echo "${NAME}：${SIZE} 字节（$((SIZE / 1048576)) MiB）"
            echo "::warning::${NAME} size=${SIZE}"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "::error::${NAME} 体积 ${SIZE} 字节（$((SIZE / 1048576)) MiB）超过码云单附件 100 MiB 上限"
              exit 1
            fi
          done

      - name: 替换 GitHub Release 中的同名安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" release/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
