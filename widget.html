<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工作台小组件</title>
<script>
(function(){
  var t = null;
  try{ t = localStorage.getItem('workbench.theme.v1'); }catch(e){}
  if(!t){ t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'mist'; }
  document.documentElement.classList.add('theme-' + t);
})();
</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI','Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
    --accent:#007AFF;
    --card-bg:rgba(255,255,255,.86);
    --card-border:rgba(255,255,255,.9);
    --card-shadow:0 18px 40px rgba(60,80,70,.24),0 2px 8px rgba(60,80,70,.12);
    --text:#111;
    --text-soft:rgba(17,17,17,.55);
    --text-faint:rgba(17,17,17,.34);
    --track:rgba(17,17,17,.07);
    --chip:rgba(17,17,17,.06);
    --chip-hover:rgba(17,17,17,.13);
    --line:rgba(17,17,17,.1);
    --btn-bg:#111;
    --btn-fg:#fff;
  }
  html.theme-mist{
    --accent:#007AFF;
    --card-bg:rgba(246,249,247,.9);
    --card-border:rgba(255,255,255,.75);
    --card-shadow:0 18px 40px rgba(40,55,48,.28),0 2px 8px rgba(40,55,48,.14);
    --text:#151917;
    --text-soft:rgba(21,25,23,.6);
    --text-faint:rgba(21,25,23,.38);
    --track:rgba(21,25,23,.08);
    --chip:rgba(21,25,23,.07);
    --chip-hover:rgba(21,25,23,.14);
    --line:rgba(21,25,23,.12);
    --btn-bg:#151917;
    --btn-fg:#F4F7F5;
  }
  html.theme-dark{
    --accent:#0A84FF;
    --card-bg:rgba(24,30,27,.88);
    --card-border:rgba(255,255,255,.1);
    --card-shadow:0 20px 44px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4);
    --text:#EDF1EE;
    --text-soft:rgba(237,241,238,.56);
    --text-faint:rgba(237,241,238,.3);
    --track:rgba(255,255,255,.07);
    --chip:rgba(255,255,255,.08);
    --chip-hover:rgba(255,255,255,.17);
    --line:rgba(255,255,255,.12);
    --btn-bg:#EDF1EE;
    --btn-fg:#0B0F0D;
  }
  html,body{height:100%;background:transparent;overflow:hidden;
    -webkit-user-select:none;user-select:none;cursor:default}
  input,textarea{-webkit-user-select:text;user-select:text}
  img{-webkit-user-drag:none}
  body{-webkit-user-select:none;user-select:none}
  .widget{
    position:relative;
    height:100%;padding:18px;display:flex;flex-direction:column;
    border-radius:22px;background:var(--card-bg);border:1px solid var(--card-border);
    box-shadow:var(--card-shadow);color:var(--text);
    -webkit-app-region:drag;
  }
  .widget.locked{-webkit-app-region:no-drag}
  button{-webkit-app-region:no-drag}

  .head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand{display:flex;align-items:center;gap:7px;min-width:0}
  .logo{width:20px;height:20px;border-radius:6px;object-fit:cover;display:block;opacity:.95;flex:0 0 auto}
  .date{font-size:11.5px;letter-spacing:.6px;color:var(--text-soft);font-weight:400;white-space:nowrap}
  .actions{display:flex;align-items:center;gap:5px}
  .icon-btn{width:24px;height:24px;border:none;border-radius:50%;background:var(--chip);
    color:var(--text-soft);display:flex;align-items:center;justify-content:center;
    cursor:default;transition:background .16s ease,color .16s ease,transform .16s ease}
  .icon-btn:hover{background:var(--chip-hover);color:var(--text)}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn svg{width:13px;height:13px;display:block}
  #closeBtn:hover{background:#E5484D;color:#fff}
  #lockBtn.on{background:var(--accent);color:#fff}
  #lockBtn.on:hover{background:var(--accent);color:#fff;filter:brightness(1.06)}
  #opacityBtn.on{background:var(--chip-hover);color:var(--text)}
  #lockBtn .ico-lock{display:none}
  .widget.locked #lockBtn .ico-unlock{display:none}
  .widget.locked #lockBtn .ico-lock{display:block}

  .opacity-row{position:absolute;left:18px;right:18px;bottom:18px;z-index:6;
    display:flex;align-items:center;gap:9px;padding:9px 11px;
    background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;
    box-shadow:var(--card-shadow);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}
  .opacity-row[hidden]{display:none}
  .opacity-row span{font-size:10.5px;color:var(--text-faint);letter-spacing:.5px;flex:0 0 auto}
  .opacity-row input[type=range]{flex:1 1 auto;min-width:0;height:3px;accent-color:var(--accent);cursor:default}
  .opacity-row b{font-size:10.5px;font-weight:400;color:var(--text-soft);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}

  .row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:10px}
  .pct{font-weight:200;font-size:44px;line-height:.86;letter-spacing:-2px;font-variant-numeric:tabular-nums;color:var(--text)}
  .pct i{font-style:normal;font-size:14px;font-weight:300;color:var(--text-soft);margin-left:2px}
  .meta{text-align:right;padding-bottom:3px}
  .label{font-size:10.5px;letter-spacing:.8px;color:var(--text-faint)}
  .counts{font-size:11.5px;color:var(--text-soft);margin-top:3px}

  .bar{display:flex;gap:3px;height:9px;background:var(--track);padding:2px;border-radius:999px;margin-top:12px}
  .bar span{flex:1;border-radius:999px;background:transparent;transition:background .3s ease}
  .bar span.on{background:var(--accent)}

  .stats{display:flex;gap:6px;margin-top:11px}
  .stats div{flex:1;background:var(--chip);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;gap:2px}
  .stats b{font-size:14px;font-weight:300;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
  .stats span{font-size:9.5px;color:var(--text-faint);letter-spacing:.5px}

  .list-title{font-size:10.5px;letter-spacing:.8px;color:var(--text-faint);margin:12px 0 7px}
  .list{list-style:none;flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:6px}
  .list li{position:relative;padding-left:13px;font-size:12px;line-height:1.5;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list li::before{content:"";position:absolute;left:0;top:6.5px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.75}
  .list li.empty{color:var(--text-faint);padding-left:0}
  .list li.empty::before{display:none}

  .open{margin-top:10px;width:100%;padding:9px;border:none;border-radius:999px;background:var(--btn-bg);color:var(--btn-fg);
    font-family:inherit;font-size:11.5px;letter-spacing:.6px;cursor:default;transition:opacity .18s ease,transform .18s ease}
  .open:hover{opacity:.86}
  .open:active{transform:scale(.985)}
</style>
</head>
<body>
<div class="widget">
  <div class="head">
    <div class="brand">
      <img class="logo" src="assets/logo.png" alt="">
      <div class="date" id="date">今天</div>
    </div>
    <div class="actions">
      <button class="icon-btn" id="opacityBtn" title="调整透明度">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7 17.7 8.4a8 8 0 1 1-11.3 0z"/></svg>
      </button>
      <button class="icon-btn" id="lockBtn" title="锁定位置">
        <svg class="ico-unlock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
        <svg class="ico-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </button>
      <button class="icon-btn" id="closeBtn" title="隐藏小组件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div class="row">
    <div class="pct"><span id="pct">0</span><i>%</i></div>
    <div class="meta">
      <div class="label">今日进度</div>
      <div class="counts" id="counts">0 / 0 已完成</div>
    </div>
  </div>
  <div class="bar" id="bar"></div>
  <div class="stats">
    <div><b id="stTodo">0</b><span>待办</span></div>
    <div><b id="stDoing">0</b><span>进行中</span></div>
    <div><b id="stDone">0</b><span>已完成</span></div>
  </div>
  <div class="list-title">待办</div>
  <ul class="list" id="list"></ul>
  <div class="opacity-row" id="opacityRow" hidden>
    <span>透明度</span>
    <input type="range" id="opacityRange" min="40" max="100" step="5" value="100">
    <b id="opacityVal">100%</b>
  </div>
  <button class="open" id="openBtn">打开工作台</button>
</div>
<script>
(function(){
  'use strict';

  var STORE_KEY = 'workbench.daily.v2';
  var THEME_KEY = 'workbench.theme.v1';
  var LOCK_KEY = 'workbench.widget.lock';
  var OPACITY_KEY = 'workbench.widget.opacity';
  var SEGMENTS = 14;
  var MAX_ITEMS = 3;

  var widgetEl = document.querySelector('.widget');
  var lockBtn = document.getElementById('lockBtn');
  var opacityBtn = document.getElementById('opacityBtn');
  var opacityRow = document.getElementById('opacityRow');
  var opacityRange = document.getElementById('opacityRange');
  var opacityVal = document.getElementById('opacityVal');

  function isLocked(){
    try{ return localStorage.getItem(LOCK_KEY) === '1'; }catch(e){ return false; }
  }

  function applyLock(){
    var locked = isLocked();
    widgetEl.classList.toggle('locked', locked);
    lockBtn.classList.toggle('on', locked);
    lockBtn.title = locked ? '已锁定位置 · 点击解锁' : '锁定位置';
  }

  lockBtn.addEventListener('click', function(){
    try{ localStorage.setItem(LOCK_KEY, isLocked() ? '0' : '1'); }catch(e){}
    applyLock();
  });

  function getOpacity(){
    var v = 100;
    try{ v = parseInt(localStorage.getItem(OPACITY_KEY), 10); }catch(e){}
    if(!Number.isFinite(v)) v = 100;
    return Math.min(100, Math.max(40, v));
  }

  function applyOpacity(){
    var v = getOpacity();
    widgetEl.style.opacity = String(v / 100);
    opacityRange.value = v;
    opacityVal.textContent = v + '%';
  }

  opacityBtn.addEventListener('click', function(){
    var open = opacityRow.hasAttribute('hidden');
    if(open) opacityRow.removeAttribute('hidden');
    else opacityRow.setAttribute('hidden', '');
    opacityBtn.classList.toggle('on', open);
  });

  opacityRange.addEventListener('input', function(){
    try{ localStorage.setItem(OPACITY_KEY, String(opacityRange.value)); }catch(e){}
    applyOpacity();
  });

  function todayKey(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function applyTheme(){
    var t = 'mist';
    try{ t = localStorage.getItem(THEME_KEY) || 'mist'; }catch(e){}
    document.documentElement.className = 'theme-' + t;
  }

  function readData(){
    var empty = {todo:[], doing:[], done:[]};
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return empty;
      var obj = JSON.parse(raw);
      if(!obj || obj.date !== todayKey()) return empty;
      return {
        todo: Array.isArray(obj.todo) ? obj.todo : [],
        doing: Array.isArray(obj.doing) ? obj.doing : [],
        done: Array.isArray(obj.done) ? obj.done : []
      };
    }catch(e){
      return empty;
    }
  }

  function render(){
    var d = new Date();
    var week = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    document.getElementById('date').textContent = (d.getMonth()+1) + '月' + d.getDate() + '日 · ' + week;

    var data = readData();
    var total = data.todo.length + data.doing.length + data.done.length;
    var done = data.done.length;
    var pct = total ? Math.round(done / total * 100) : 0;

    document.getElementById('pct').textContent = pct;
    document.getElementById('counts').textContent = done + ' / ' + total + ' 已完成';
    document.getElementById('stTodo').textContent = data.todo.length;
    document.getElementById('stDoing').textContent = data.doing.length;
    document.getElementById('stDone').textContent = done;

    var bar = document.getElementById('bar');
    var filled = Math.round(pct / 100 * SEGMENTS);
    bar.innerHTML = '';
    for(var i = 0; i < SEGMENTS; i++){
      var seg = document.createElement('span');
      if(i < filled) seg.className = 'on';
      bar.appendChild(seg);
    }

    var list = document.getElementById('list');
    list.innerHTML = '';
    var items = data.todo.slice(0, MAX_ITEMS);
    if(!items.length){
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = total ? '待办已清空' : '今天还没有任务';
      list.appendChild(li);
    }else{
      items.forEach(function(t){
        var item = document.createElement('li');
        item.textContent = t.title;
        item.title = t.title;
        list.appendChild(item);
      });
    }
  }

  document.getElementById('openBtn').addEventListener('click', function(){
    if(window.appBridge && window.appBridge.action) window.appBridge.action('openMain');
  });
  document.getElementById('closeBtn').addEventListener('click', function(){
    if(window.appBridge && window.appBridge.action) window.appBridge.action('widget-hide');
  });

  window.addEventListener('storage', function(e){
    if(!e.key || e.key === STORE_KEY || e.key === THEME_KEY || e.key === LOCK_KEY || e.key === OPACITY_KEY){
      applyTheme();
      applyLock();
      applyOpacity();
      render();
    }
  });
  window.addEventListener('focus', function(){ applyLock(); applyOpacity(); render(); });

  applyTheme();
  applyLock();
  applyOpacity();
  render();
  setInterval(function(){
    applyTheme();
    render();
  }, 30000);
})();
</script>
</body>
</html>
